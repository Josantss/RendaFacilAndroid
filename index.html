
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renda Fácil</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#081b33,#145477);
color:white;
text-align:center;
padding:20px;
}
.container{max-width:500px;margin:auto}
h1{color:#ffd700}
.info{
display:flex;
justify-content:space-around;
background:#ffffff18;
padding:15px;
border-radius:12px;
margin:20px 0;
}
.tabuleiro{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}
.carta{
height:105px;
border:2px solid #ffffff55;
border-radius:14px;
background:#17618b;
font-size:38px;
cursor:pointer;
color:white;
}
.carta:disabled{cursor:default}
.carta.aberta{background:white}
button.jogar{
margin-top:22px;
padding:15px 30px;
border:0;
border-radius:12px;
background:#ffd700;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
#mensagem{margin-top:20px;font-size:18px}
</style>
</head>
<body>
<div class="container">
<h1>💰 RENDA FÁCIL</h1>
<p>Encontre três imagens iguais!</p>

<div class="info">
<div>⭐ Pontos<br><b id="pontos">0</b></div>
<div>🎯 Tentativas<br><b id="tentativas">5</b></div>
</div>

<div class="tabuleiro" id="tabuleiro"></div>

<div id="mensagem">Clique em jogar para começar!</div>

<button class="jogar" onclick="iniciar()">🎮 JOGAR</button>
</div>

<script>
let imagens=[];
let selecionadas=[];
let pontos=0;
let tentativas=5;
let bloqueado=true;
let paresEncontrados=0;

function embaralhar(lista){
return lista.sort(()=>Math.random()-0.5);
}

function iniciar(){
pontos=0;
tentativas=5;
paresEncontrados=0;
selecionadas=[];
bloqueado=false;

document.getElementById("pontos").textContent=pontos;
document.getElementById("tentativas").textContent=tentativas;
document.getElementById("mensagem").textContent=
"Encontre três imagens iguais!";

imagens=embaralhar([
"🐱","🐱","🐱",
"🍎","🍎","🍎",
"🚗","🚗","🚗"
]);

let tabuleiro=document.getElementById("tabuleiro");
tabuleiro.innerHTML="";

imagens.forEach((imagem,i)=>{
let carta=document.createElement("button");
carta.className="carta";
carta.textContent="❓";
carta.dataset.imagem=imagem;
carta.onclick=()=>clicar(carta);
tabuleiro.appendChild(carta);
});
}

function clicar(carta){
if(bloqueado ||
carta.classList.contains("aberta") ||
carta.disabled) return;

carta.classList.add("aberta");
carta.textContent=carta.dataset.imagem;
selecionadas.push(carta);

if(selecionadas.length===3){
bloqueado=true;
tentativas--;
document.getElementById("tentativas").textContent=tentativas;

let iguais=selecionadas.every(c=>
c.dataset.imagem===selecionadas[0].dataset.imagem
);

if(iguais){
pontos+=10;
paresEncontrados++;
document.getElementById("pontos").textContent=pontos;

selecionadas.forEach(c=>c.disabled=true);
document.getElementById("mensagem").textContent=
"🎉 Parabéns! Você encontrou três imagens iguais!";

selecionadas=[];
bloqueado=false;

if(paresEncontrados===3){
bloqueado=true;
document.getElementById("mensagem").textContent=
"🏆 Você venceu! Pontuação: "+pontos;
}
}else{
document.getElementById("mensagem").textContent=
"Não são iguais! Tente novamente.";

setTimeout(()=>{
selecionadas.forEach(c=>{
c.classList.remove("aberta");
c.textContent="❓";
});
selecionadas=[];
if(tentativas===0){
bloqueado=true;
document.getElementById("mensagem").textContent=
"Fim de jogo! Sua pontuação: "+pontos;
}else{
bloqueado=false;
}
},1000);
}
}
}
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renda Fácil</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#081b33,#123d5a);
 color:white;text-align:center;min-height:100vh
}
.container{max-width:500px;margin:auto}
h1{color:#ffd700;font-size:32px}
.info{
 display:flex;justify-content:space-around;
 gap:8px;margin:20px 0;flex-wrap:wrap
}
.info div{
 background:#ffffff18;padding:12px;
 border-radius:12px;flex:1;min-width:90px
}
.board{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:12px;margin:20px auto
}
.card{
 background:#17618a;border:2px solid #55c8ff;
 border-radius:14px;min-height:90px;
 font-size:38px;display:flex;
 align-items:center;justify-content:center;
 cursor:pointer;box-shadow:0 4px 8px #0005;
 user-select:none
}
.card.hidden{background:linear-gradient(145deg,#17618a,#092c4a)}
.card.found{
 background:#176b42;border-color:#48ef9a;
 cursor:default
}
button{
 border:0;border-radius:12px;padding:14px 22px;
 font-size:17px;font-weight:bold;cursor:pointer;
 margin:8px;background:#ffd700;color:#172b3c
}
button:disabled{opacity:.5;cursor:default}
#message{
 min-height:55px;font-size:18px;
 font-weight:bold;margin:15px 0
}
.small{color:#c8e5f5;font-size:14px}
</style>
</head>
<body>
<div class="container">

<h1>💰 RENDA FÁCIL</h1>
<p>Encontre três imagens iguais e ganhe pontos!</p>

<div class="info">
 <div>🏆 Pontos<br><strong id="score">0</strong></div>
 <div>🎮 Nível<br><strong id="level">1</strong></div>
 <div>❤️ Tentativas<br><strong id="tries">5</strong></div>
</div>

<p id="progress">Encontre 3 combinações!</p>

<div class="board" id="board"></div>

<div id="message">Boa sorte! Clique em 3 cartas.</div>

<button id="next" hidden onclick="nextLevel()">Próximo nível ➜</button>
<button onclick="restart()">🔄 Recomeçar</button>

<p class="small">Renda Fácil © 2026</p>

</div>

<script>
const levels = [
 ['🐱','🍎','🚗'],
 ['🐱','🍎','🚗','⚽'],
 ['🐱','🍎','🚗','⚽','🌟']
];

let level = 0;
let score = 0;
let tries = 5;
let selected = [];
let found = 0;
let locked = false;
let cards = [];
let gameOver = false;

const board = document.getElementById('board');
const message = document.getElementById('message');
const next = document.getElementById('next');

function shuffle(array){
 for(let i=array.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [array[i],array[j]]=[array[j],array[i]];
 }
 return array;
}

function update(){
 document.getElementById('score').textContent=score;
 document.getElementById('level').textContent=level+1;
 document.getElementById('tries').textContent=tries;
 document.getElementById('progress').textContent=
 'Combinações encontradas: '+found+' de '+levels[level].length;
}

function startLevel(){
 tries=5;
 found=0;
 selected=[];
 locked=false;
 gameOver=false;
 next.hidden=true;
 board.innerHTML='';

 let symbols=[];
 levels[level].forEach(symbol=>{
  for(let i=0;i<3;i++) symbols.push(symbol);
 });

 cards=shuffle(symbols).map((symbol,index)=>({
  id:index,
  symbol:symbol,
  found:false
 }));

 board.style.gridTemplateColumns=
 cards.length<=9?'repeat(3,1fr)':'repeat(4,1fr)';

 cards.forEach(card=>{
  const element=document.createElement('div');
  element.className='card hidden';
  element.textContent='❓';
  element.onclick=()=>reveal(card,element);
  card.element=element;
  board.appendChild(element);
 });

 message.textContent='Encontre três imagens iguais!';
 update();
}

function reveal(card,element){
 if(locked || gameOver || card.found ||
 selected.some(item=>item.card===card)) return;

 element.textContent=card.symbol;
 element.classList.remove('hidden');
 selected.push({card,element});

 if(selected.length===3){
  locked=true;
  tries--;
  update();

  const match=selected.every(item=>
   item.card.symbol===selected[0].card.symbol
  );

  if(match){
   selected.forEach(item=>{
    item.card.found=true;
    item.element.classList.add('found');
   });

   score+=10;
   found++;
   message.textContent='🎉 Muito bem! +10 pontos!';
   selected=[];
   locked=false;
   update();

   if(found===levels[level].length){
    if(level===levels.length-1){
     message.textContent='🏆 PARABÉNS! Você venceu todos os níveis!';
     gameOver=true;
    }else{
     message.textContent='🌟 Nível concluído! Avance para continuar!';
     next.hidden=false;
     gameOver=true;
    }
   }else if(tries===0){
    message.textContent='Fim das tentativas! Tente novamente.';
    gameOver=true;
   }
  }else{
   message.textContent='❌ Não são iguais! Tente novamente.';

   setTimeout(()=>{
    selected.forEach(item=>{
     item.element.textContent='❓';
     item.element.classList.add('hidden');
    });
    selected=[];
    locked=false;

    if(tries===0){
     message.textContent='😢 Acabaram as tentativas! Recomece.';
     gameOver=true;
    }
   },1000);
  }
 }
}

function nextLevel(){
 level++;
 if(level>=levels.length) return;
 startLevel();
}

function restart(){
 level=0;
 score=0;
 startLevel();
}

startLevel();
</script>
</body>
</html>

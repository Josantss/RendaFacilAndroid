<!DOCTYPE html>
<html lang="pt-BR">
<head>

body{margin:0;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#081b33,#123d5a);color:#fff;text-align:center;min-height:100vh}
.container{max-width:500px;margin:auto}

.nivel{background:#ffd700;color:#081b33;padding:8px;border-radius:20px;font-weight:bold;display:inline-block}
.card{background:#fff;color:#333;border-radius:16px;padding:16px;margin:12px 0;text-align:left;display:flex;justify-content:space-between;align-items:center}
.card b{font-size:17px}

button{background:#0a8a3f;color:#fff;border:none;padding:12px 18px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
button:active{transform:scale(0.97)}
#mensagem{margin-top:15px;font-size:18px;min-height:24px}
</style>
</head>
